name = "techhat-studio-vault"
main = "worker.js"
compatibility_date = "2025-01-01"

# 1. Create D1 Database:
#    npx wrangler d1 create techhat_vault_db
#    npx wrangler d1 execute techhat_vault_db --file=./schema.sql
[[d1_databases]]
binding = "DB"
database_name = "techhat_vault_db"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

# 2. Create R2 Bucket (10 GB Free Tier):
#    npx wrangler r2 bucket create techhat-vault-files
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "techhat-vault-files"
